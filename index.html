<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Gift For You</title>
    <!-- React & Tailwind CSS & Lucide Icons -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes custom-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .animate-custom-bounce {
            animation: custom-bounce 2s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // アイコンコンポーネント
        const LucideIcon = ({ name, size = 24, className = "" }) => {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    const iconSvg = window.lucide.icons[name].toSvg({
                        width: size,
                        height: size,
                        class: className,
                        'stroke-width': 2
                    });
                    setSvg(iconSvg);
                }
            }, [name, size, className]);
            return <span dangerouslySetInnerHTML={{ __html: svg }} className="inline-block" />;
        };

        const App = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [showContent, setShowContent] = useState(false);
            const [giftUrl, setGiftUrl] = useState("https://www.google.com/"); 

            useEffect(() => {
                // URLのパラメータからギフトURLを取得 (?url=...)
                const params = new URLSearchParams(window.location.search);
                const urlParam = params.get('url');
                if (urlParam) {
                    try {
                        setGiftUrl(decodeURIComponent(urlParam));
                    } catch (e) {
                        setGiftUrl(urlParam);
                    }
                }
            }, []);

            const handleOpen = () => {
                setIsOpen(true);
                setTimeout(() => setShowContent(true), 500);
            };

            return (
                <div className={`min-h-screen w-full flex flex-col items-center justify-center p-4 transition-colors duration-1000 ${isOpen ? 'bg-rose-50' : 'bg-indigo-50'}`}>
                    
                    <div className={`max-w-md w-full bg-white rounded-[3rem] shadow-2xl overflow-hidden border-4 transition-all duration-1000 flex flex-col ${isOpen ? 'border-rose-200' : 'border-indigo-100'}`}>
                        
                        {/* ヘッダー装飾 */}
                        <div className={`h-28 flex items-center justify-center relative overflow-hidden transition-colors duration-1000 ${isOpen ? 'bg-rose-500' : 'bg-indigo-500'}`}>
                            <div className="absolute inset-0 opacity-10 flex flex-wrap gap-4 p-2">
                                {[...Array(20)].map((_, i) => (
                                    <LucideIcon key={i} name={isOpen ? "Heart" : "Star"} size={32} className="text-white" />
                                ))}
                            </div>
                            <div className="relative z-10 text-white font-black text-xl tracking-widest">
                                {isOpen ? 'CONGRATS!' : 'SPECIAL GIFT'}
                            </div>
                            <div className="absolute top-4 right-[-35px] font-black py-1 px-12 transform rotate-45 shadow-md text-[10px] bg-yellow-300 text-rose-800">
                                FOR YOU
                            </div>
                        </div>

                        {/* メインエリア */}
                        <div className="px-8 py-10 text-center">
                            {!isOpen ? (
                                <div className="space-y-8 flex flex-col items-center">
                                    <div 
                                        className="text-9xl cursor-pointer hover:scale-110 transition-transform active:scale-95 animate-custom-bounce"
                                        onClick={handleOpen}
                                    >
                                        🎁
                                    </div>
                                    
                                    <div>
                                        <h1 className="text-2xl font-black text-indigo-900 mb-3">プレゼントが届きました</h1>
                                        <p className="text-gray-500 font-medium leading-relaxed">
                                            いつも頑張っているあなたへ。<br />
                                            大切な人からの贈り物が届いています。
                                        </p>
                                    </div>

                                    <button 
                                        onClick={handleOpen}
                                        className="group w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-5 rounded-2xl shadow-lg transform transition-all flex items-center justify-center space-x-3 text-lg"
                                    >
                                        <LucideIcon name="Gift" size={24} className="group-hover:rotate-12 transition-transform" />
                                        <span>ギフトを開封する</span>
                                    </button>
                                </div>
                            ) : (
                                <div className={`space-y-6 transition-all duration-700 ${showContent ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                                    <div className="text-7xl mb-4 relative inline-block">
                                        ☕️
                                        <div className="absolute -top-4 -right-4 animate-ping text-rose-400">✨</div>
                                    </div>

                                    <div className="bg-rose-50 p-6 rounded-[2rem] border-2 border-dashed border-rose-200 relative">
                                        <h2 className="text-xl font-black text-rose-700 mb-3">
                                            心ばかりの<br/>リラックスギフト
                                        </h2>
                                        
                                        <div className="w-12 h-1 bg-rose-200 mx-auto mb-4 rounded-full"></div>

                                        <p className="text-gray-700 font-bold mb-8 leading-relaxed">
                                            「いつもお疲れさまです！<br />
                                            少しでも癒やされますように。✨」
                                        </p>

                                        <div className="space-y-4">
                                            <a 
                                                href={giftUrl} 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                className="block w-full bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-black py-5 rounded-2xl shadow-xl transform transition-all active:scale-95 flex items-center justify-center space-x-3 text-lg"
                                            >
                                                <span>ギフトを受け取る</span>
                                                <LucideIcon name="ExternalLink" size={20} />
                                            </a>
                                            
                                            <p className="text-[10px] text-rose-800/60 font-bold">
                                                ※外部サイトに移動します。チケットを保存してください。
                                            </p>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={() => {setIsOpen(false); setShowContent(false);}} 
                                        className="text-rose-700/40 hover:text-rose-700 font-bold text-sm flex items-center justify-center mx-auto space-x-1 transition-colors"
                                    >
                                        <LucideIcon name="RotateCcw" size={14} />
                                        <span>もう一度閉じる</span>
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* フッター装飾 */}
                        <div className={`p-4 border-t flex justify-around transition-colors duration-1000 ${isOpen ? 'bg-rose-100/50 border-rose-100' : 'bg-indigo-50 border-indigo-100'}`}>
                            <div className="flex flex-col items-center">
                                <LucideIcon name={isOpen ? "Heart" : "Moon"} size={20} className={isOpen ? "text-rose-500" : "text-indigo-400"} />
                                <span className="text-[8px] font-black opacity-40 mt-1 uppercase">Love</span>
                            </div>
                            <div className="flex flex-col items-center">
                                <LucideIcon name={isOpen ? "Smile" : "Coffee"} size={20} className={isOpen ? "text-rose-500" : "text-indigo-400"} />
                                <span className="text-[8px] font-black opacity-40 mt-1 uppercase">Peace</span>
                            </div>
                            <div className="flex flex-col items-center">
                                <LucideIcon name={isOpen ? "Sparkles" : "Star"} size={20} className={isOpen ? "text-rose-500" : "text-indigo-400"} />
                                <span className="text-[8px] font-black opacity-40 mt-1 uppercase">Joy</span>
                            </div>
                        </div>
                    </div>

                    <div className="mt-8 flex flex-col items-center opacity-40">
                        <p className="text-[10px] font-black tracking-[0.2em] text-gray-800 uppercase">
                            Made with Heart
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
