<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Gift</title>
    <!-- 安定したライブラリのみを読み込み -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ふわふわ浮くアニメーション */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        /* キラキラ光るアニメーション */
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .animate-float { animation: float 3s infinite ease-in-out; }
        .animate-sparkle { animation: sparkle 1.5s infinite ease-in-out; }
        
        body { margin: 0; }
    </style>
</head>
<body>
    <div id="root" class="flex items-center justify-center min-h-screen text-gray-400 font-bold">
        Loading...
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // シンプルなアイコンコンポーネント（SVGを直接埋め込み）
        const SvgIcon = ({ type, className = "" }) => {
            const icons = {
                gift: <path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z" />,
                external: <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3" />,
                rotate: <path d="M1 4v6h6M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
            };
            return (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className} style={{width: '1.2em', height: '1.2em'}}>
                    {icons[type]}
                </svg>
            );
        };

        const App = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [giftUrl, setGiftUrl] = useState("https://www.google.com/"); 
            const [giftUrl2, setGiftUrl2] = useState(""); 
            const [theme, setTheme] = useState("1");
            const [layoutStyle, setLayoutStyle] = useState("1"); // ボタンの数

            // 配色パターンの定義
            const themeConfig = {
                "1": { // イエロー・ピンク系
                    bgBefore: "bg-yellow-50",
                    bgAfter: "bg-pink-50",
                    borderBefore: "border-yellow-200",
                    borderAfter: "border-pink-200",
                    headerBefore: "bg-amber-400",
                    headerAfter: "bg-rose-500",
                    badgeTextBefore: "text-amber-800",
                    badgeTextAfter: "text-rose-800",
                    badgeBgBefore: "bg-white",
                    badgeBgAfter: "bg-yellow-300",
                    titleBefore: "text-amber-900",
                    titleAfter: "text-rose-700",
                    btnBefore: "bg-rose-500 hover:bg-rose-600",
                    btnAfter: "from-rose-500 to-pink-500",
                    cardFooterBefore: "bg-amber-50 border-amber-100",
                    cardFooterAfter: "bg-rose-100/50 border-rose-100",
                    subTitleAfter: "text-rose-400",
                    iconCircle: "bg-amber-100"
                },
                "2": { // ブルー・パープル系
                    bgBefore: "bg-blue-50",
                    bgAfter: "bg-purple-50",
                    borderBefore: "border-blue-200",
                    borderAfter: "border-purple-200",
                    headerBefore: "bg-indigo-400",
                    headerAfter: "bg-violet-500",
                    badgeTextBefore: "text-indigo-800",
                    badgeTextAfter: "text-violet-800",
                    badgeBgBefore: "bg-white",
                    badgeBgAfter: "bg-cyan-300",
                    titleBefore: "text-indigo-900",
                    titleAfter: "text-violet-700",
                    btnBefore: "bg-violet-500 hover:bg-violet-600",
                    btnAfter: "from-violet-500 to-purple-500",
                    cardFooterBefore: "bg-indigo-50 border-indigo-100",
                    cardFooterAfter: "bg-purple-100/50 border-purple-100",
                    subTitleAfter: "text-violet-400",
                    iconCircle: "bg-indigo-100"
                }
            };

            const currentTheme = themeConfig[theme] || themeConfig["1"];

            // URLを修正する関数
            const sanitizeUrl = (url) => {
                if (!url) return "";
                let decoded = decodeURIComponent(url);
                // http:// または https:// で始まっていない場合は https:// を付ける
                if (!decoded.match(/^https?:\/\//i)) {
                    return `https://${decoded}`;
                }
                return decoded;
            };

            useEffect(() => {
                try {
                    const params = new URLSearchParams(window.location.search);
                    
                    // ギフトURLの取得
                    const urlParam = params.get('url');
                    if (urlParam) setGiftUrl(sanitizeUrl(urlParam));
                    
                    const urlParam2 = params.get('url2');
                    if (urlParam2) setGiftUrl2(sanitizeUrl(urlParam2));
                    
                    // テーマの取得
                    const themeParam = params.get('theme');
                    if (themeParam && (themeParam === "1" || themeParam === "2")) {
                        setTheme(themeParam);
                    }

                    // スタイルの取得
                    const styleParam = params.get('style');
                    if (styleParam && (styleParam === "1" || styleParam === "2")) {
                        setLayoutStyle(styleParam);
                    }
                } catch (e) {
                    console.error("URLの読み取りに失敗しました", e);
                }
            }, []);

            return (
                <div className={`min-h-screen w-full flex flex-col items-center justify-center p-4 transition-all duration-1000 ${isOpen ? currentTheme.bgAfter : currentTheme.bgBefore}`}>
                    
                    <div className={`max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border-4 transition-all duration-1000 ${isOpen ? currentTheme.borderAfter : currentTheme.borderBefore}`}>
                        
                        {/* ヘッダー */}
                        <div className={`h-24 flex items-center justify-center relative overflow-hidden transition-colors duration-1000 ${isOpen ? currentTheme.headerAfter : currentTheme.headerBefore}`}>
                            <div className="absolute inset-0 opacity-20 flex justify-around items-center p-4 text-white text-3xl">
                                <span>{isOpen ? '✨' : '🎁'}</span>
                                <span>{isOpen ? '⭐' : '✨'}</span>
                                <span>{isOpen ? '🌟' : '🎈'}</span>
                            </div>
                            <div className={`absolute top-4 right-[-35px] font-black py-1 px-12 transform rotate-45 shadow-md text-[10px] transition-colors ${isOpen ? currentTheme.badgeBgAfter + ' ' + currentTheme.badgeTextAfter : currentTheme.badgeBgBefore + ' ' + currentTheme.badgeTextBefore}`}>
                                {isOpen ? 'CONGRATS!' : 'FOR YOU'}
                            </div>
                        </div>

                        <div className="px-8 py-10 text-center">
                            {!isOpen ? (
                                <div className="space-y-8 flex flex-col items-center">
                                    <div className="relative cursor-pointer group" onClick={() => setIsOpen(true)}>
                                        <div className={`w-32 h-32 ${currentTheme.iconCircle} rounded-full flex items-center justify-center shadow-xl animate-float relative z-10 group-hover:scale-110 transition-transform`}>
                                            <span className="text-6xl">🎂</span>
                                        </div>
                                        <div className="absolute inset-0 bg-current opacity-20 rounded-full blur-xl animate-pulse"></div>
                                    </div>

                                    <div className="space-y-3">
                                        <h1 className={`text-3xl font-black ${currentTheme.titleBefore} tracking-tighter`}>HAPPY BIRTHDAY!!</h1>
                                        <p className="text-gray-600 font-bold whitespace-pre-wrap leading-relaxed text-lg">
                                            お誕生日おめでとう！！{"\n"}今年もすてきな年になりますように！！
                                        </p>
                                    </div>

                                    <button 
                                        onClick={() => setIsOpen(true)}
                                        className={`w-full ${currentTheme.btnBefore} text-white font-black py-5 rounded-2xl shadow-lg flex items-center justify-center space-x-3 text-lg transition-all active:scale-95`}
                                    >
                                        <SvgIcon type="gift" />
                                        <span>プレゼントを開ける</span>
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-6 animate-in zoom-in duration-500 relative">
                                    {/* 周りの星デコレーション */}
                                    <div className="absolute -top-4 -left-4 text-2xl animate-sparkle" style={{animationDelay: '0.1s'}}>⭐</div>
                                    <div className="absolute -top-8 right-2 text-xl animate-sparkle" style={{animationDelay: '0.3s'}}>🌟</div>
                                    <div className="absolute top-10 -right-4 text-2xl animate-sparkle" style={{animationDelay: '0.5s'}}>✨</div>
                                    
                                    <div className="flex justify-center space-x-4 relative z-10">
                                        <div className="text-7xl animate-float" style={{animationDelay: '0.2s'}}>🥤</div>
                                        <div className="text-7xl animate-float" style={{animationDelay: '0s'}}>🍦</div>
                                    </div>
                                    
                                    <div className={`${isOpen && theme === "2" ? "bg-purple-50" : "bg-rose-50"} p-8 rounded-[2rem] border-2 border-dashed ${isOpen && theme === "2" ? "border-purple-200" : "border-rose-200"} relative`}>
                                        <div className="absolute top-2 left-2 text-yellow-400 opacity-60">⭐</div>
                                        <div className="absolute bottom-2 right-2 text-yellow-400 opacity-60">🌟</div>

                                        <h2 className={`text-3xl font-black ${currentTheme.titleAfter} mb-4`}>Happy Birthday✨</h2>
                                        
                                        <div className="space-y-2 mb-8">
                                            <p className="text-xl text-gray-800 font-black leading-relaxed">
                                                よかったらおいしいもの{"\n"}飲んでね！！
                                            </p>
                                            <p className={`text-sm ${currentTheme.subTitleAfter} font-bold`}>By ゆーち</p>
                                        </div>

                                        <div className="flex flex-col gap-3">
                                            <a 
                                                href={giftUrl} target="_blank" rel="noopener noreferrer"
                                                className={`block w-full bg-gradient-to-r ${currentTheme.btnAfter} text-white font-black py-5 rounded-xl shadow-xl flex items-center justify-center space-x-2 text-lg hover:brightness-110 transition-all`}
                                            >
                                                <span>ギフトを受け取る{layoutStyle === "2" ? " ①" : ""}</span>
                                                <SvgIcon type="external" />
                                            </a>

                                            {layoutStyle === "2" && giftUrl2 && (
                                                <a 
                                                    href={giftUrl2} target="_blank" rel="noopener noreferrer"
                                                    className={`block w-full bg-gradient-to-r ${currentTheme.btnAfter} text-white font-black py-5 rounded-xl shadow-xl flex items-center justify-center space-x-2 text-lg hover:brightness-110 transition-all`}
                                                >
                                                    <span>ギフトを受け取る ②</span>
                                                    <SvgIcon type="external" />
                                                </a>
                                            )}
                                        </div>
                                    </div>

                                    <button onClick={() => setIsOpen(false)} className="text-gray-400 font-bold text-xs flex items-center justify-center mx-auto space-x-1 hover:opacity-100 transition-opacity">
                                        <SvgIcon type="rotate" />
                                        <span>戻る</span>
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* 下部デコレーション */}
                        <div className={`p-4 border-t flex justify-around transition-colors duration-1000 ${isOpen ? currentTheme.cardFooterAfter : currentTheme.cardFooterBefore}`}>
                            {[isOpen ? '⭐' : '🎈', '🎂', '🥤', '🍦', '🎁', isOpen ? '🌟' : '✨'].map((e, i) => (
                                <span key={i} className={`text-lg transition-all duration-500 ${isOpen ? 'opacity-100 scale-110' : 'opacity-20'}`}>
                                    {e}
                                </span>
                            ))}
                        </div>
                    </div>

                    <div className="mt-8 text-gray-400 text-[10px] font-bold flex flex-col items-center space-y-2 text-center">
                        <div className="flex items-center space-x-2 uppercase tracking-widest">
                            <span>✨</span>
                            <span>Happy Birthday to You!</span>
                            <span>✨</span>
                        </div>
                        <p className="normal-case">This page is built by ゆーち with Gemini.</p>
                    </div>
                </div>
            );
        };

        // Reactのレンダリング
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch (e) {
            document.getElementById('root').innerHTML = "<p style='padding:20px; text-align:center;'>表示エラーが発生しました。</p>";
        }
    </script>
</body>
</html>
