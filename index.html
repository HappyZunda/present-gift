<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Gift</title>
    <!-- ライブラリの読み込み -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        .animate-float { animation: float 3s infinite ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // アイコン表示用パーツ
        const Icon = ({ name, size = 24, className = "" }) => {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    const iconSvg = window.lucide.icons[name].toSvg({
                        width: size, height: size, class: className, 'stroke-width': 2.5
                    });
                    setSvg(iconSvg);
                }
            }, [name, size, className]);
            return <span dangerouslySetInnerHTML={{ __html: svg }} className="inline-block" />;
        };

        const App = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [giftUrl, setGiftUrl] = useState("https://www.google.com/"); 

            // ==========================================
            // ✨ 設定：ここを自由に変更できます
            // ==========================================
            const content = {
                // 開く前の画面
                before: {
                    title: "HAPPY BIRTHDAY!!",
                    desc: "お誕生日おめでとう！！\n今年もすてきな年になりますように！！",
                    button: "プレゼントを開ける",
                    badge: "FOR YOU",
                    emoji: "🎂" // 真ん中の丸の中の絵文字
                },
                // 開いた後の画面
                after: {
                    title: "おめでとう！！",
                    message: "ぜひどうぞ！",
                    button: "ギフトを受け取る",
                    emoji: "🍦", // アイス
                    drinkEmoji: "🥤" // スタバ風ドリンク
                }
            };
            // ==========================================

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const urlParam = params.get('url');
                if (urlParam) setGiftUrl(decodeURIComponent(urlParam));
            }, []);

            return (
                <div className={`min-h-screen w-full flex flex-col items-center justify-center p-4 transition-all duration-1000 ${isOpen ? 'bg-pink-50' : 'bg-yellow-50'}`}>
                    
                    <div className={`max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border-4 transition-all duration-1000 ${isOpen ? 'border-pink-200' : 'border-yellow-200'}`}>
                        
                        {/* ヘッダー装飾 */}
                        <div className={`h-24 flex items-center justify-center relative overflow-hidden transition-colors duration-1000 ${isOpen ? 'bg-rose-500' : 'bg-amber-400'}`}>
                            <div className="absolute inset-0 opacity-20 flex justify-around items-center p-4">
                                <Icon name="Gift" size={40} className="text-white" />
                                <Icon name="Heart" size={40} className="text-white" />
                                <Icon name="PartyPopper" size={40} className="text-white" />
                            </div>
                            <div className={`absolute top-4 right-[-35px] font-black py-1 px-12 transform rotate-45 shadow-md text-[10px] transition-colors ${isOpen ? 'bg-yellow-300 text-rose-800' : 'bg-white text-amber-800'}`}>
                                {isOpen ? 'CONGRATS!' : content.before.badge}
                            </div>
                        </div>

                        <div className="px-8 py-10 text-center">
                            {!isOpen ? (
                                <div className="space-y-8 flex flex-col items-center">
                                    <div className="relative cursor-pointer group" onClick={() => setIsOpen(true)}>
                                        <div className="w-32 h-32 bg-amber-100 rounded-full flex items-center justify-center shadow-xl animate-float relative z-10 group-hover:scale-110 transition-transform">
                                            <span className="text-6xl">{content.before.emoji}</span>
                                        </div>
                                        <div className="absolute inset-0 bg-yellow-200 rounded-full blur-xl opacity-50 animate-pulse"></div>
                                    </div>

                                    <div className="space-y-3">
                                        <h1 className="text-3xl font-black text-amber-900 tracking-tighter">{content.before.title}</h1>
                                        <p className="text-gray-600 font-bold whitespace-pre-wrap leading-relaxed">
                                            {content.before.desc}
                                        </p>
                                    </div>

                                    <button 
                                        onClick={() => setIsOpen(true)}
                                        className="w-full bg-rose-500 hover:bg-rose-600 text-white font-black py-5 rounded-2xl shadow-lg flex items-center justify-center space-x-3 text-lg transition-all active:scale-95"
                                    >
                                        <Icon name="Gift" size={24} />
                                        <span>{content.before.button}</span>
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-6 animate-in zoom-in duration-500">
                                    <div className="flex justify-center space-x-4">
                                        <div className="text-7xl">{content.after.drinkEmoji}</div>
                                        <div className="text-7xl">{content.after.emoji}</div>
                                    </div>
                                    
                                    <div className="bg-rose-50 p-8 rounded-[2rem] border-2 border-dashed border-rose-200 relative">
                                        <h2 className="text-3xl font-black text-rose-700 mb-4 whitespace-pre-wrap">
                                            {content.after.title}
                                        </h2>
                                        
                                        <p className="text-xl text-gray-800 font-black mb-8 whitespace-pre-wrap">
                                            {content.after.message}
                                        </p>

                                        <a 
                                            href={giftUrl} target="_blank" rel="noopener noreferrer"
                                            className="block w-full bg-gradient-to-r from-rose-500 to-pink-500 text-white font-black py-5 rounded-xl shadow-xl flex items-center justify-center space-x-2 text-lg hover:brightness-110 transition-all"
                                        >
                                            <span>{content.after.button}</span>
                                            <Icon name="ExternalLink" size={20} />
                                        </a>
                                    </div>

                                    <button onClick={() => setIsOpen(false)} className="text-gray-400 font-bold text-xs flex items-center justify-center mx-auto space-x-1">
                                        <Icon name="RotateCcw" size={14} />
                                        <span>戻る</span>
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* 下部デコレーション */}
                        <div className={`p-4 border-t flex justify-around ${isOpen ? 'bg-rose-100/50 border-rose-100' : 'bg-amber-50 border-amber-100'}`}>
                            {['🎈', '🎂', '🥤', '🍦', '🎁', '✨'].map((e, i) => (
                                <span key={i} className={`text-lg transition-opacity duration-500 ${isOpen ? 'opacity-100' : 'opacity-20'}`}>
                                    {e}
                                </span>
                            ))}
                        </div>
                    </div>

                    <div className="mt-8 text-gray-400 text-[10px] font-black tracking-widest uppercase">
                        Happy Birthday to You!
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
